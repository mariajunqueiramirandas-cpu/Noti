name: Pen shortcut probe artifact

on:
  push:
    branches: [codex/pen-shortcut-probe-artifact]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify standalone probe
        run: >-
          python3 tools/pen-shortcut-probe/build.py
          --sdk "$ANDROID_HOME"
          --jdk "$JAVA_HOME_17_X64"
          --out work/pen-shortcut-probe
      - uses: actions/upload-artifact@v4
        with:
          name: noti-pen-probe
          path: work/pen-shortcut-probe/noti-pen-probe.apk
          if-no-files-found: error
          retention-days: 7
