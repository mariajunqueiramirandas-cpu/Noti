services:
  relay:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/noti.sqlite
      TRUST_PROXY: "true"
    volumes:
      - noti-relay:/data
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./server/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      relay:
        condition: service_healthy

volumes:
  noti-relay:
  caddy-data:
  caddy-config:
