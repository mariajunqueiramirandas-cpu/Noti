<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Nunito, 'Segoe UI', Roboto, sans-serif">
  <rect width="900" height="300" rx="16" fill="#EEEAE4"/>
  <defs>
    <g id="page">
      <rect x="0" y="0" width="270" height="236" rx="6" fill="#FFFFFF" stroke="#D6D1CB"/>
      <text x="20" y="32" font-size="13" font-weight="700" fill="#2A2830">Worksheet 3 · Heat</text>
      <text x="20" y="68" font-size="11" fill="#2A2830">Name:</text>
      <line x1="58" y1="70" x2="250" y2="70" stroke="#2A2830" stroke-width="1" stroke-dasharray="1.5 2.5"/>
      <text x="20" y="104" font-size="11" fill="#2A2830">2. Why does a hot cup of tea cool down?</text>
      <line x1="20" y1="142" x2="250" y2="142" stroke="#8FB3D9" stroke-width="1"/>
      <line x1="20" y1="172" x2="250" y2="172" stroke="#8FB3D9" stroke-width="1"/>
      <line x1="20" y1="202" x2="250" y2="202" stroke="#8FB3D9" stroke-width="1"/>
    </g>
  </defs>

  <!-- 1. Loop -->
  <g transform="translate(20,0)">
    <text x="0" y="34" font-size="15" font-weight="800" fill="#5C4A87">1</text>
    <text x="16" y="34" font-size="14" font-weight="700" fill="#2A2830">Loop the lines</text>
    <g transform="translate(0,48)">
      <use href="#page"/>
      <path d="M12 128 C 40 112, 220 110, 258 126 C 272 150, 270 196, 252 214 C 200 228, 50 226, 16 212 C 4 190, 2 146, 12 128 Z"
            fill="#5C4A87" fill-opacity="0.06" stroke="#5C4A87" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 2. Lines found -->
  <g transform="translate(315,0)">
    <text x="0" y="34" font-size="15" font-weight="800" fill="#5C4A87">2</text>
    <text x="16" y="34" font-size="14" font-weight="700" fill="#2A2830">Noti finds them</text>
    <g transform="translate(0,48)">
      <use href="#page"/>
      <g stroke="#5C4A87" stroke-width="5" stroke-opacity="0.35" stroke-linecap="round">
        <line x1="20" y1="142" x2="250" y2="142"/>
        <line x1="20" y1="172" x2="250" y2="172"/>
        <line x1="20" y1="202" x2="250" y2="202"/>
      </g>
      <g font-size="9" font-weight="800" fill="#FBFAF8" text-anchor="middle">
        <circle cx="12" cy="142" r="7" fill="#5C4A87"/><text x="12" y="145">1</text>
        <circle cx="12" cy="172" r="7" fill="#5C4A87"/><text x="12" y="175">2</text>
        <circle cx="12" cy="202" r="7" fill="#5C4A87"/><text x="12" y="205">3</text>
      </g>
      <g fill="#FBFAF8" stroke="#5C4A87" stroke-width="1.5">
        <circle cx="250" cy="142" r="3.5"/><circle cx="250" cy="172" r="3.5"/><circle cx="250" cy="202" r="3.5"/>
      </g>
    </g>
  </g>

  <!-- 3. Type -->
  <g transform="translate(610,0)">
    <text x="0" y="34" font-size="15" font-weight="800" fill="#5C4A87">3</text>
    <text x="16" y="34" font-size="14" font-weight="700" fill="#2A2830">Type, it sits on the lines</text>
    <g transform="translate(0,48)">
      <use href="#page"/>
      <g font-size="13" fill="#3B5BA9">
        <text x="24" y="141">It loses heat to the colder air</text>
        <text x="24" y="171">around it until both are at the</text>
        <text x="24" y="201">same temperature.</text>
      </g>
      <rect x="142" y="189" width="1.5" height="13" fill="#5C4A87"/>
    </g>
  </g>
</svg>
