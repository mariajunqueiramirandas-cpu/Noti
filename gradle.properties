# Build speed. CI overrides org.gradle.jvmargs to size the heap to the runner.
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
# Compile Kotlin inside the Gradle daemon: no second JVM to start and warm up.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

android.useAndroidX=false
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=true
